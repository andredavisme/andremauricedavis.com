<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting…</title>
  <script>
    // Forward any ?return= param that may have arrived here, otherwise pass current URL.
    const params = new URLSearchParams(window.location.search);
    const ret    = params.get('return') || window.location.href;
    window.location.replace(
      'https://auth.andremauricedavis.com/?return=' + encodeURIComponent(ret)
    );
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0;url=https://auth.andremauricedavis.com/" />
  </noscript>
</head>
<body></body>
</html>
