<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed — André Maurice Davis</title>

  <!-- AMD Ember fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ── AMD Ember Design Tokens ──────────────────────────────── */
    :root {
      --color-primary:         #c97b12;
      --color-primary-hover:   #a8660f;
      --color-orange:          #d95e1a;
      --color-bg:              #f8f5f0;
      --color-surface:         #faf7f3;
      --color-surface-mid:     #f2ede5;
      --color-surface-raised:  #ede8df;
      --color-border:          #d9d0c0;
      --color-border-light:    #e8e2d8;
      --color-text:            #1f1a13;
      --color-text-muted:      #5a5040;
      --color-text-faint:      #8a7f6e;
      --color-success:         #2d7a3a;
      --font-display:          'Instrument Serif', Georgia, serif;
      --font-body:             'Work Sans', 'Helvetica Neue', sans-serif;
      --text-xs:   clamp(0.7rem,  0.65rem + 0.2vw, 0.78rem);
      --text-sm:   clamp(0.82rem, 0.78rem + 0.2vw, 0.9rem);
      --text-base: clamp(0.95rem, 0.88rem + 0.3vw, 1.05rem);
      --text-md:   clamp(1.05rem, 0.95rem + 0.4vw, 1.2rem);
      --text-lg:   clamp(1.2rem,  1.1rem  + 0.5vw, 1.4rem);
      --text-xl:   clamp(1.4rem,  1.25rem + 0.7vw, 1.75rem);
      --text-2xl:  clamp(1.7rem,  1.5rem  + 1vw,   2.2rem);
      --text-hero: clamp(2rem,    1.75rem + 1.5vw,  2.8rem);
      --radius:    10px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.09);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
    }

    [data-theme="dark"] {
      --color-bg:             #1a1610;
      --color-surface:        #211d15;
      --color-surface-mid:    #2a2419;
      --color-surface-raised: #332d1f;
      --color-border:         #3d3525;
      --color-border-light:   #2e2820;
      --color-text:           #f0ebe0;
      --color-text-muted:     #b5a98a;
      --color-text-faint:     #7a6f58;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      font-size: var(--text-base);
      color: var(--color-text);
      background: var(--color-bg);
      min-height: 100vh;
    }

    a { color: var(--color-primary); }

    /* ── Nav ──────────────────────────────────────────────────── */
    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      padding: 0 1.5rem;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      font-family: var(--font-display);
      font-size: var(--text-lg);
      color: var(--color-text);
    }

    .nav-logo {
      width: 32px;
      height: 32px;
      background: var(--color-primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 400;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .nav-user {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }

    .nav-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--color-surface-raised);
      object-fit: cover;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.9rem;
      border-radius: var(--radius);
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: background 0.15s, opacity 0.15s;
      text-decoration: none;
    }

    .btn-primary { background: var(--color-primary); color: #fff; }
    .btn-primary:hover { background: var(--color-primary-hover); }
    .btn-ghost {
      background: transparent;
      color: var(--color-text-muted);
      border: 1px solid var(--color-border);
    }
    .btn-ghost:hover { background: var(--color-surface-mid); }
    .btn-sm { padding: 0.3rem 0.7rem; font-size: var(--text-xs); }

    .theme-toggle {
      background: none;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      width: 34px;
      height: 34px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: var(--color-text-muted);
      transition: background 0.15s;
    }
    .theme-toggle:hover { background: var(--color-surface-mid); }

    /* ── Page shell ───────────────────────────────────────────── */
    .page-header {
      padding: 2.5rem 1.5rem 1rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .page-title {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      color: var(--color-text);
      margin-bottom: 0.35rem;
    }

    .page-subtitle {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }

    /* ── Filter bar ───────────────────────────────────────────── */
    .feed-filters {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0.75rem 1.5rem 0;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .feed-filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem 0.85rem;
      border-radius: 99px;
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-muted);
      transition: all 0.15s;
    }

    .feed-filter-btn:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .feed-filter-btn.active {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #fff;
    }

    /* ── Feed grid ────────────────────────────────────────────── */
    .feed-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.25rem 1.5rem 3rem;
    }

    #feed-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
    }

    .feed-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--color-text-muted);
      font-size: var(--text-md);
    }

    /* ── Feed card ────────────────────────────────────────────── */
    .feed-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border-light);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: box-shadow 0.2s, transform 0.15s;
    }

    .feed-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .feed-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem 0;
    }

    .feed-card-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--badge-color, var(--color-primary));
      letter-spacing: 0.01em;
    }

    .feed-card-badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--badge-color, var(--color-primary));
      flex-shrink: 0;
    }

    .feed-card-time {
      font-size: var(--text-xs);
      color: var(--color-text-faint);
    }

    .feed-card-media {
      width: 100%;
      aspect-ratio: 16/9;
      overflow: hidden;
      margin-top: 0.75rem;
      position: relative;
      background: var(--color-surface-mid);
    }

    .feed-card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .feed-card-media--video .feed-card-play {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.3);
      color: #fff;
      font-size: 2rem;
      pointer-events: none;
    }

    .feed-card-body {
      padding: 0.85rem 1rem 0.5rem;
      flex: 1;
    }

    .feed-card-title {
      font-family: var(--font-display);
      font-size: var(--text-md);
      color: var(--color-text);
      margin-bottom: 0.4rem;
      line-height: 1.35;
    }

    .feed-card-text {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      line-height: 1.6;
    }

    .feed-card-footer {
      padding: 0.6rem 1rem 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      border-top: 1px solid var(--color-border-light);
      margin-top: 0.5rem;
    }

    .feed-card-stats {
      display: flex;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    .feed-card-stat {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: var(--text-xs);
      color: var(--color-text-faint);
    }

    .feed-card-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .feed-card-link {
      font-size: var(--text-xs);
      color: var(--color-text-faint);
      text-decoration: none;
    }
    .feed-card-link:hover { color: var(--color-primary); }

    /* ── Spinner ──────────────────────────────────────────────── */
    #feed-spinner {
      display: none;
      justify-content: center;
      padding: 2rem;
      grid-column: 1 / -1;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Load more ────────────────────────────────────────────── */
    .feed-load-more-wrap {
      text-align: center;
      margin-top: 2rem;
    }

    #feed-load-more { display: none; }

    /* ── Auth gate overlay (shown before session resolves) ────── */
    #auth-gate {
      position: fixed;
      inset: 0;
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 999;
    }

    #auth-gate .gate-logo {
      width: 56px;
      height: 56px;
      background: var(--color-primary);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: var(--font-display);
      font-size: 1.8rem;
    }

    #auth-gate p {
      color: var(--color-text-muted);
      font-size: var(--text-sm);
    }
  </style>
</head>
<body>

  <!-- Auth gate (hidden once session confirmed) -->
  <div id="auth-gate">
    <div class="gate-logo">A</div>
    <p>Checking your session…</p>
  </div>

  <!-- Nav -->
  <nav class="nav">
    <a class="nav-brand" href="/feed.html">
      <div class="nav-logo">A</div>
      André Maurice Davis
    </a>
    <div class="nav-actions">
      <div class="nav-user" id="nav-user"></div>
      <button class="theme-toggle" id="theme-toggle" title="Toggle dark mode">🌙</button>
      <button class="btn btn-ghost btn-sm" id="sign-out-btn">Sign out</button>
    </div>
  </nav>

  <!-- Page header -->
  <div class="page-header">
    <h1 class="page-title">The Feed</h1>
    <p class="page-subtitle">Content from Facebook, Reddit, LinkedIn, and YouTube — in one place.</p>
  </div>

  <!-- Platform filter bar -->
  <div class="feed-filters">
    <button class="feed-filter-btn active" data-platform="all">All</button>
    <button class="feed-filter-btn" data-platform="facebook">📘 Facebook</button>
    <button class="feed-filter-btn" data-platform="reddit">🟠 Reddit</button>
    <button class="feed-filter-btn" data-platform="linkedin">💼 LinkedIn</button>
    <button class="feed-filter-btn" data-platform="youtube">▶️ YouTube</button>
  </div>

  <!-- Feed grid -->
  <div class="feed-wrap">
    <div id="feed-grid">
      <div id="feed-spinner"><div class="spinner"></div></div>
    </div>
    <div class="feed-load-more-wrap">
      <button class="btn btn-ghost" id="feed-load-more">Load more</button>
    </div>
  </div>

  <script type="module">
    import { requireAuth, signOut } from './js/amd-auth.js';
    import { loadPosts, setActivePlatform } from './js/amd-feed.js';

    (async () => {
      // Auth gate
      const user = await requireAuth();
      if (!user) return; // redirected to login.html

      document.getElementById('auth-gate').style.display = 'none';

      // Populate nav user
      const session = window.amdSession;
      const meta    = session?.user?.user_metadata;
      if (meta) {
        document.getElementById('nav-user').innerHTML = `
          ${meta.avatar_url ? `<img class="nav-avatar" src="${meta.avatar_url}" alt="">` : ''}
          <span>${meta.full_name ?? 'Member'}</span>
        `;
      }

      // Sign out
      document.getElementById('sign-out-btn').addEventListener('click', signOut);

      // Theme toggle
      const html   = document.documentElement;
      const toggle = document.getElementById('theme-toggle');
      const saved  = localStorage.getItem('amd-theme') ?? 'light';
      html.setAttribute('data-theme', saved);
      toggle.textContent = saved === 'dark' ? '☀️' : '🌙';
      toggle.addEventListener('click', () => {
        const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('amd-theme', next);
        toggle.textContent = next === 'dark' ? '☀️' : '🌙';
      });

      // Filter buttons
      document.querySelectorAll('.feed-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => setActivePlatform(btn.dataset.platform));
      });

      // Load more button
      document.getElementById('feed-load-more').addEventListener('click', () => loadPosts());

      // Initial load
      loadPosts();
    })();
  </script>

</body>
</html>
